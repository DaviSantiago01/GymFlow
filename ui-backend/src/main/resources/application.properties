spring.application.name=treino-conecta
spring.datasource.url=${TREINO_BANCO_URL:jdbc:h2:file:./data/treino-conecta;DB_CLOSE_ON_EXIT=FALSE;LOCK_TIMEOUT=10000}
spring.datasource.username=${TREINO_BANCO_USUARIO:sa}
spring.datasource.password=${TREINO_BANCO_SENHA:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=30m
server.error.include-message=never
treino.reservas.intervalo-ms=1000
logging.level.org.hibernate.SQL=INFO
logging.level.org.springframework=INFO
