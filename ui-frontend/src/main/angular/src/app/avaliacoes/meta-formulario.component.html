<main class="pagina">
  <header class="pagina-cabecalho">
    <div>
      <span class="pagina-sobretitulo">Avaliação física</span>
      <h1>{{ alteracao() ? 'Gerenciar meta' : 'Nova meta' }}</h1>
    </div>
    <div class="pagina-links"><a routerLink="/core/meta/pesquisa">Metas</a></div>
  </header>

  <section class="bloco">
    <div class="formulario-grade">
      <label
        >Aluno
        <select [(ngModel)]="alunoEscolhido" [disabled]="alteracao()">
          <option value="">Selecione</option>
          @for (aluno of formulario().alunos; track aluno.identificador) {
            <option [value]="aluno.identificador">{{ aluno.nome }}</option>
          }
        </select>
      </label>
      <label
        >Indicador
        <select [(ngModel)]="indicador" [disabled]="alteracao()">
          <option value="">Selecione</option>
          @for (item of formulario().indicadores; track item) {
            <option [value]="item">{{ rotulos[item] }}</option>
          }
        </select>
      </label>
      <label
        >Valor desejado
        <input type="number" step="0.1" min="0" [(ngModel)]="valorDesejado" />
      </label>
      <label
        >Início
        <input type="date" [(ngModel)]="inicio" />
      </label>
      <label
        >Fim
        <input type="date" [(ngModel)]="fim" />
      </label>
    </div>
    <p>A meta parte do valor do indicador na avaliação válida mais recente do aluno.</p>
  </section>

  @if (erro()) {
    <div class="aviso aviso-erro" role="alert">{{ erro() }}</div>
  }
  <div class="grupo-acoes">
    @if (alteracao()) {
      <button type="button" class="acao acao-principal" [disabled]="ocupado()" (click)="alterar('ajustar')">
        Salvar alteração
      </button>
      <button
        type="button"
        class="acao acao-secundaria"
        [disabled]="ocupado()"
        (click)="alterar('substituir')"
      >
        Substituir por nova meta
      </button>
      <button type="button" class="acao acao-perigo" [disabled]="ocupado()" (click)="encerrar()">
        Encerrar meta
      </button>
    } @else {
      <button type="button" class="acao acao-principal" [disabled]="ocupado()" (click)="criar()">
        Salvar meta
      </button>
    }
  </div>
</main>
