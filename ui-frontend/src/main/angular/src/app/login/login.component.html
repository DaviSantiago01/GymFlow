<main class="pagina acesso">
  <section class="bloco acesso-cartao" aria-labelledby="titulo-entrar">
    <div class="acesso-marca">
      <span class="acesso-logo" aria-hidden="true">▥</span>
      <div>
        <strong>Treino Conecta</strong>
        <span>Treinos, avaliações e armários da academia</span>
      </div>
    </div>
    <h1 id="titulo-entrar">Entrar</h1>
    <p>Use o usuário e a senha da sua conta.</p>
    <form #formulario="ngForm" (ngSubmit)="entrar()">
      <div class="campo">
        <label for="usuario">Usuário</label>
        <input
          id="usuario"
          name="usuario"
          autocomplete="username"
          [(ngModel)]="usuario"
          required
          autofocus
        />
      </div>
      <div class="campo">
        <label for="senha">Senha</label>
        <input
          id="senha"
          name="senha"
          type="password"
          autocomplete="current-password"
          [(ngModel)]="senha"
          required
        />
      </div>
      <button
        class="acao acao-principal acao-larga"
        type="submit"
        [disabled]="formulario.invalid || entrando()"
      >
        Entrar
      </button>
    </form>
    <p class="acesso-rodape">
      Ainda não tem uma conta?
      <a routerLink="/core/aluno/cadastro">Criar minha conta</a>
    </p>
  </section>
</main>
