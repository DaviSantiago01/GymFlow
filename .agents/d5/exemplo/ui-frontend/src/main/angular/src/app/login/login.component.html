<div class="d-flex justify-content-center align-items-center" style="min-height: 80vh;">
  <div class="card shadow-sm" style="width: 24rem;">
    <div class="card-body">
      <h1 class="h4 mb-3 text-center">Entrar</h1>
      <form #formulario="ngForm" (ngSubmit)="entrar()">
        <div class="mb-3">
          <label class="form-label" for="usuario">Usuário</label>
          <input class="form-control" id="usuario" name="usuario" [(ngModel)]="usuario" required autofocus />
        </div>
        <div class="mb-3">
          <label class="form-label" for="senha">Senha</label>
          <input class="form-control" id="senha" name="senha" type="password" [(ngModel)]="senha" required />
        </div>
        <button class="btn btn-primary w-100" type="submit" [disabled]="formulario.invalid || entrando()">
          Entrar
        </button>
      </form>
    </div>
  </div>
</div>
