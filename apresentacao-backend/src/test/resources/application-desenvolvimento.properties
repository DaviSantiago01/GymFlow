# Perfil de desenvolvimento: banco H2 em memória, recriado a cada execução.
# Ativado por BackendDesenvolvimentoAplicacao.

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.generate-ddl=true

spring.jpa.properties.jakarta.persistence.schema-generation.database.action=drop-and-create
spring.jpa.properties.jakarta.persistence.schema-generation.scripts.action=create
spring.jpa.properties.jakarta.persistence.schema-generation.scripts.create-target=schema.sql
spring.jpa.properties.hibernate.hbm2ddl.schema-generation.script.append=false

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

spring.datasource.driverClassName=org.h2.Driver
spring.datasource.url=jdbc:h2:mem:sga
spring.datasource.username=sa
spring.datasource.password=password

spring.h2.console.enabled=true
