# ============================================================
# JPA / Hibernate
# ============================================================

# Exibe no console o SQL gerado pelo Hibernate
spring.jpa.show-sql=true

# Formata o SQL exibido no console
spring.jpa.properties.hibernate.format_sql=true

# Habilita a geração de DDL a partir das entidades JPA
spring.jpa.generate-ddl=true

# Geração do schema DIRETAMENTE no banco de dados.
# Atenção: quando as propriedades jakarta.persistence.schema-generation.*
# estão presentes, elas têm precedência sobre spring.jpa.generate-ddl e
# spring.jpa.hibernate.ddl-auto. Sem a linha abaixo nenhuma tabela é criada.
spring.jpa.properties.jakarta.persistence.schema-generation.database.action=drop-and-create

# Geração do script DDL em arquivo, para conferência do mapeamento
spring.jpa.properties.jakarta.persistence.schema-generation.scripts.action=create
spring.jpa.properties.jakarta.persistence.schema-generation.scripts.create-target=schema.sql

# Sobrescreve o schema.sql em vez de acrescentar no fim (antes ficava duplicado)
spring.jpa.properties.hibernate.hbm2ddl.schema-generation.script.append=false

# ============================================================
# Banco de dados - desenvolvimento local (H2 em arquivo)
# ============================================================

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

spring.datasource.driverClassName=org.h2.Driver
spring.datasource.url=jdbc:h2:./sga
spring.datasource.username=sa
spring.datasource.password=password

spring.h2.console.enabled=true

